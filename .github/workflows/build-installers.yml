name: Build installers and the update package

# Runs by itself when a release is published (or by hand for an existing tag). Builds:
#   * the in-app update package + latest.json - every running copy (2.1.0 and later) sees the new
#     version within a few hours and can install it from inside the app (source/updates);
#   * the macOS .dmg and the Linux .deb / .tar.gz, each tested by really installing it, running the
#     first-start setup and opening the app off-screen.
# and attaches them to the release. (The Windows installer is built with Inno Setup from
# installer/ClashRektBot.iss; Windows copies update themselves from the update package.)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (e.g. v2.1.0)
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: The tag must match the VERSION file
        run: |
          set -e
          V="$(tr -d '[:space:]' < VERSION)"
          if [ "v$V" != "$TAG" ]; then echo "::error::VERSION says $V but the release tag is $TAG"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build the update package
        run: |
          set -e
          gh release view "$TAG" --json body --jq .body > notes.md
          python3 tools/build_update.py . dist --notes notes.md --repo "$GITHUB_REPOSITORY"
          python3 source/updates/engine.py verify "dist/ClashRektBot-${VERSION}-update.zip"
      - name: Test - install it over the previous files with the update engine
        run: |
          set -e
          mkdir -p old && git archive HEAD | tar -x -C old && echo 0.0.1 > old/VERSION
          python3 tools/build_update.py --manifest-only old
          mkdir new && (cd new && unzip -q "../dist/ClashRektBot-${VERSION}-update.zip")
          python3 source/updates/engine.py install-dir --source new --root old
          test "$(cat old/VERSION)" = "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: update
          path: dist/
      - name: Attach to the release (latest.json last, so the app never sees it before the package)
        run: |
          set -e
          # the update package is also the "no installer" download: unzip and run a Start script
          cp "dist/ClashRektBot-${VERSION}-update.zip" "dist/ClashRektBot-${VERSION}.zip"
          gh release upload "$TAG" "dist/ClashRektBot-${VERSION}-update.zip" "dist/ClashRektBot-${VERSION}-update.zip.sha256" "dist/ClashRektBot-${VERSION}.zip" --clobber
          gh release upload "$TAG" dist/latest.json --clobber

  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build Clash Rekt Bot.app
        run: python3 tools/build_unix_packages.py mac . build "$VERSION"
      - name: App icon
        run: |
          set -e
          SET=build/AppIcon.iconset; mkdir -p "$SET"
          for s in 16 32 128 256 512; do
            sips -z $s $s runtime/assets/crb_icon_1024.png --out "$SET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); sips -z $d $d runtime/assets/crb_icon_1024.png --out "$SET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$SET" -o "build/Clash Rekt Bot.app/Contents/Resources/AppIcon.icns"
      - name: Sign (ad-hoc, so macOS does not call the app damaged)
        run: codesign --force --deep --sign - "build/Clash Rekt Bot.app"
      - name: Test - first-start setup and the app window on macOS
        run: |
          set -e
          "build/Clash Rekt Bot.app/Contents/MacOS/ClashRektBot" --no-launch
          T="$HOME/Library/Application Support/Clash Rekt Bot"
          "$T/.crb/venv/bin/python" tools/ci_smoke.py "$T" macos-dashboard.png
      - name: Build the .dmg
        run: |
          set -e
          mkdir dmg
          cp -R "build/Clash Rekt Bot.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Clash Rekt Bot" -srcfolder dmg -ov -format UDZO "ClashRektBot-${VERSION}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            ClashRektBot-*-macOS.dmg
            macos-dashboard.png
      - name: Attach to the release
        run: gh release upload "$TAG" "ClashRektBot-${VERSION}-macOS.dmg" --clobber

  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Qt runtime libraries (for the off-screen check)
        run: sudo apt-get update && sudo apt-get install -y rsync libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Build the .deb and .tar.gz
        run: |
          set -e
          python3 tools/build_unix_packages.py linux . build "$VERSION"
          dpkg-deb --root-owner-group --build build/deb "clash-rekt-bot_${VERSION}_all.deb"
          tar -C build/deb/opt -czf "ClashRektBot-${VERSION}-linux.tar.gz" --transform 's,^clash-rekt-bot,ClashRektBot,' clash-rekt-bot
      - name: Test - install the .deb, first-start setup and the app window on Linux
        run: |
          set -e
          sudo apt-get install -y "./clash-rekt-bot_${VERSION}_all.deb"
          clash-rekt-bot --no-launch
          T="$HOME/.local/share/clash-rekt-bot"
          "$T/.crb/venv/bin/python" tools/ci_smoke.py "$T" linux-dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            clash-rekt-bot_*_all.deb
            ClashRektBot-*-linux.tar.gz
            linux-dashboard.png
      - name: Attach to the release
        run: gh release upload "$TAG" "clash-rekt-bot_${VERSION}_all.deb" "ClashRektBot-${VERSION}-linux.tar.gz" --clobber
